#model config
use_resenc: false
max_v: 3.0
n_steps: 5
lambda_jac: 1.0
lambda_smooth: 0.1
lambda_ce: 0.1
lambda_dice: 0.9
kernel_size: 7
sigma: 10


defaults:
  - models: deform_dynunet
  - optimizers: AdamW
  - data: data_deform
  - trainer: deformSegTrainer
  - _self_


