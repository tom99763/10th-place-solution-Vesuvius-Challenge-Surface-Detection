lightning_trainer:
  _target_: pytorch_lightning.trainer.trainer.Trainer
  max_epochs: 100
  accelerator: gpu
  devices: 1
  precision: 32
  check_val_every_n_epoch: 1
  strategy: auto

lightning_module:
  _target_: src.trainers.seg25dTrainer.ScrollSegmentorTrainer25D
  prediction_threshold: 0.5
  _partial_: True
  prediction_threshold: 0.62
  batch_size: ${batch_size}
  input_size: ${input_size}
  
  loss:
    _target_: monai.losses.DiceCELoss
    sigmoid: True
    softmax: False
    to_onehot_y: False
    reduction: mean
    squared_pred: True
    lambda_ce: 0.1
    lambda_dice: 0.9

  optimizer_factory:
    _target_: torch.optim.AdamW
    _partial_: True
    lr: ${lr}
    weight_decay: 0.1
    betas: [ 0.9, 0.999 ]

  scheduler_configs:
    cosine_annealing_few:
      interval: step
      frequency: 10
      scheduler:
        _target_: torch.optim.lr_scheduler.CosineAnnealingLR
        _partial_: True
        T_max: 1000
        eta_min: 0.0000001
        last_epoch: -1

    linear_warmup: null
    cosine_annealing: null


