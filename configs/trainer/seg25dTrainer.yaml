lightning_trainer:
  _target_: lightning.pytorch.trainer.trainer.Trainer
  default_root_dir: "./models"
  
  val_check_interval: 1000
  max_time: "00:12:00:00"
  max_steps: 46000
  max_epochs: -1
  accelerator: gpu
  enable_checkpointing: True
  precision: 32
  log_every_n_steps: 10

lightning_module:
  _target_: src.trainers.seg25dTrainer.ScrollSegmentorTrainer25D
  prediction_threshold: 0.5

  loss:
    _target_: monai.losses.DiceCELoss
    sigmoid: True
    softmax: False
    to_onehot_y: False
    reduction: "mean"
    squared_pred: True
    lambda_ce: 0.1
    lambda_dice: 0.9

  optimizer_factory:
    _target_: torch.optim.AdamW
    _partial_: True
    lr: ${lr}
    weight_decay: 0.1
    betas: [ 0.9, 0.999 ]

  scheduler_configs:
    cosine_annealing_few:
      interval: step
      frequency: 10
      scheduler:
        _target_: torch.optim.lr_scheduler.CosineAnnealingLR
        _partial_: True
        T_max: 1000
        eta_min: 0.0000001
        last_epoch: -1

    linear_warmup: null
    cosine_annealing: null