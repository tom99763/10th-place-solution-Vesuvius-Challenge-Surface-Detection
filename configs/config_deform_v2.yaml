project_name: vesurvius-challenge
exp_name: deform-dynunet-v2-k${kernel_size}-s${sigma}-custom${custom}
data_path: ./data/vesuvius-challenge-surface-detection
oof_path : ./data/prob_predictions
oof_path2: ''
nnunet_path: ./nnunet
petrained_ckpt_path: ''
data_split_path: ./splits.json
batch_size: 1
num_workers: 4
lr: 1e-3
offline: true
fold_id: 0
n_splits: 5
seed: 42
input_size: [160, 160, 160]
threshold: 0.5
selected_fold: 0
is_prob_oof_mask: true
apply_gaussian: false

#model config
use_resenc: true
custom: true
kernel_size: 0
sigma: 0
#warp
max_v: 1.5
n_steps: 6
lambda_jac: 0.3
lambda_smooth: 0.05
lambda_ce: 0.5
lambda_dice: 1.5
# topology gate
lambda_sparse: 0.1
lambda_tv: 0.02
lambda_boundary: 0.1
max_topo_offset: 1.0


defaults:
  - models: deform_dynunet_v2
  - optimizers: AdamW
  - data: data_deform
  - trainer: deformSegTrainer
  - _self_


