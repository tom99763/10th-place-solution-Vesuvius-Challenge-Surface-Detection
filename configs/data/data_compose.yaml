transforms:
  train:
    - EnsureChannelFirstd:
        keys: ["Image", "Mask", "Mask_OOF"]
        channel_dim: "no_channel"

    - EnsureTyped:
        keys: ["Image", "Mask", "Mask_OOF"]
        dtype: float32

    # === Intensity handling: exactly what nnUNet CTNormalization does ===
    # 1. Clip to [0.5%, 99.5%] percentile → then z-score using foreground stats
    - ScaleIntensityRanged:
        keys: ["Image"]
        a_min: 0.0          # percentile_00_5
        a_max: 213.0        # percentile_99_5 → from your JSON!
        b_min: -5.0
        b_max: 5.0
        clip: true

    # === 3D patch extraction: exactly 3d_fullres ===
    - RandCropByPosNegLabeld:
        keys: ["Image", "Mask", "Mask_OOF"]
        label_key: "Mask"
        spatial_size: ${input_size}   # ← exact patch_size from 3d_fullres
        pos: 2
        neg: 0
        num_samples: 2
        image_key: "Image"
        image_threshold: 0.0

#    # === Optional but highly recommended light 3D augs (nnUNet also uses them) ===
#    - Rand3DElasticd:
#        keys: ["Image", "Mask", "Mask_OOF", "Skeleton", "Edge", "Cover"]
#        prob: 0.3
#        sigma_range: [15, 25]
#        magnitude_range: [100, 200]
#        spatial_size: ${input_size}
#        mode: ["bilinear", "nearest", "nearest", "nearest", "nearest", "nearest"]
#        padding_mode: "zeros"
#
#    - RandAffined:
#        keys: ["Image", "Mask", "Mask_OOF", "Skeleton", "Edge", "Cover"]
#        prob: 0.3
#        rotate_range: [(-0.26, 0.26), (-0.26, 0.26), (-0.05, 0.05)]
#        scale_range: [(-0.15, 0.15), (-0.15, 0.15), (-0.05, 0.05)]
#        mode: ["bilinear", "nearest", "nearest", "nearest", "nearest", "nearest"]
#        spatial_size:${input_size}
#
#    - RandGaussianNoised:
#        keys: ["Image"]
#        prob: 0.15
#        mean: 0.0
#        std: 0.02

    - ToTensord:
        keys: ["Image", "Mask", "Mask_OOF"]

  val:
    - EnsureChannelFirstd:
        keys: ["Image", "Mask", "Mask_OOF"]
        channel_dim: "no_channel"

    - EnsureTyped:
        keys: ["Image", "Mask", "Mask_OOF"]
        dtype: float32

    - ScaleIntensityRanged:
        keys: ["Image"]
        a_min: 0.0
        a_max: 213.0
        b_min: -5.0
        b_max: 5.0
        clip: true

    - ToTensord:
        keys: ["Image", "Mask", "Mask_OOF"]

  test:
    - EnsureChannelFirstd:
        keys: [ "Image", "Mask_OOF"]
        channel_dim: "no_channel"

    - EnsureTyped:
        keys: [ "Image", "Mask_OOF"]
        dtype: float32

    - ScaleIntensityRanged:
        keys: [ "Image" ]
        a_min: 0.0
        a_max: 213.0
        b_min: -5.0
        b_max: 5.0
        clip: true

    - ToTensord:
        keys: [ "Image", "Mask_OOF"]