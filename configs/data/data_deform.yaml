transforms:
  train:
    - EnsureChannelFirstd:
        keys: ["Image", "Mask", "Mask_OOF", "Skel"]
        channel_dim: "no_channel"

    - EnsureTyped:
        keys: ["Image", "Mask", "Mask_OOF", "Skel"]
        dtype: float32

    - ScaleIntensityRanged:
        keys: ["Image"]
        a_min: 0.0
        a_max: 213.0
        b_min: -5.0
        b_max: 5.0
        clip: true

    - RandCropByPosNegLabeld:
        keys: ["Image", "Mask", "Mask_OOF", "Skel"]
        label_key: "Mask"
        spatial_size: ${input_size}
        pos: 2
        neg: 0
        num_samples: 2
        image_key: "Image"
        image_threshold: 0.0

    - RandAffined:
        keys: [ "Image", "Mask", "Mask_OOF", "Skel" ]
        prob: 0.6
        rotate_range: [ 0.15, 0.15, 0.15 ]     # ~8–9°
        shear_range: [ 0.08, 0.08, 0.08 ]     # much stronger shear
        scale_range: [ 0.15, 0.15, 0.15 ]     # ±15% zoom
        translate_range: [ 10, 10, 10 ]        # larger spatial shifts
        mode: [ "bilinear", "nearest", "bilinear", "nearest" ]
        padding_mode: "border"

    - RandCoarseDropoutd:
        keys: [ "Mask_OOF" ]
        prob: 0.4
        holes: 12
        spatial_size: [ 20, 20, 20 ]
        fill_value: 0.0

    - RandGaussianNoised:
        keys: [ "Mask_OOF" ]
        prob: 0.4
        mean: 0.0
        std: 0.25

    - RandShiftIntensityd:
        keys: ["Image"]
        offsets: 0.1
        prob: 0.2

    - RandHistogramShiftd:
        keys: ["Image"]
        num_control_points: 10
        prob: 0.15

    # --------------------------------------------------
    # 9. Final tensor conversion
    # --------------------------------------------------
    - ToTensord:
        keys: ["Image", "Mask", "Mask_OOF", "Skel"]

  # ==================================================
  # VALIDATION (no geometry corruption)
  # ==================================================
  val:
    - EnsureChannelFirstd:
        keys: ["Image", "Mask", "Mask_OOF", "Skel"]
        channel_dim: "no_channel"

    - EnsureTyped:
        keys: ["Image", "Mask", "Mask_OOF", "Skel"]
        dtype: float32

    - ScaleIntensityRanged:
        keys: ["Image"]
        a_min: 0.0
        a_max: 213.0
        b_min: -5.0
        b_max: 5.0
        clip: true

    - ToTensord:
        keys: ["Image", "Mask", "Mask_OOF", "Skel"]

  # ==================================================
  # TEST (image + noisy mask only)
  # ==================================================
  test:
    - EnsureChannelFirstd:
        keys: ["Image", "Mask_OOF"]
        channel_dim: "no_channel"

    - EnsureTyped:
        keys: ["Image", "Mask_OOF"]
        dtype: float32

    - ScaleIntensityRanged:
        keys: ["Image"]
        a_min: 0.0
        a_max: 213.0
        b_min: -5.0
        b_max: 5.0
        clip: true

    - ToTensord:
        keys: ["Image", "Mask_OOF"]
