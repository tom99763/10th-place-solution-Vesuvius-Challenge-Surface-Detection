transforms:
  train:
    - EnsureChannelFirstd:
        keys: ["Image", "Mask", "Mask_OOF"]
        channel_dim: "no_channel"

    - EnsureTyped:
        keys: ["Image", "Mask", "Mask_OOF"]

    - ScaleIntensityd:
        keys: [ "Image" ]
        minv: 0
        maxv: 1

    - RandCropByPosNegLabeld:
        keys: ["Image", "Mask", "Mask_OOF"]
        label_key: "Mask"
        spatial_size: [-1, 128, 128]
        pos: 9
        neg: 3
        num_samples: 12
        image_threshold: 0

    - ToTensord:
        keys: ["Image", "Mask", "Mask_OOF"]


  val:
    - EnsureChannelFirstd:
        keys: ["Image", "Mask", "Mask_OOF"]
        channel_dim: "no_channel"

    - EnsureTyped:
        keys: ["Image", "Mask", "Mask_OOF"]

    - ScaleIntensityd:
        keys: ["Image"]
        minv: 0
        maxv: 1

    - ToTensord:
        keys: ["Image", "Mask", "Mask_OOF"]