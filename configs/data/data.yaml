image_size: ${input_size}
input_size: [320, 320]
vol_size: [320, 320]
transforms:
  train:
    - EnsureChannelFirstd:
        keys: ["Image", "Mask"]
        channel_dim: "no_channel"
    - EnsureTyped:
        keys: ["Image", "Mask"]
    - Resized:
        keys: ["Image", "Mask"]
        spatial_size: ${vol_size}
        mode: ["bilinear", "nearest"]
    - ScaleIntensityd:
        keys: ["Image"]
        minv: 0
        maxv: 1
    - ToTensord:
        keys: ["Image", "Mask"]

  val:
    - EnsureChannelFirstd:
        keys: ["Image", "Mask"]
        channel_dim: "no_channel"
    - EnsureTyped:
        keys: ["Image", "Mask"]
    - Resized:
        keys: ["Image", "Mask"]
        spatial_size: ${vol_size}
        mode: ["bilinear", "nearest"]
    - ScaleIntensityRangePercentilesd:
        keys: ["Image"]
        lower: 2
        upper: 98
        b_min: 0
        b_max: 1
    - ToTensord:
        keys: ["Image", "Mask"]