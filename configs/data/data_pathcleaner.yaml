transforms:
  train:
    - EnsureChannelFirstd:
        keys: ["Image", "Mask", "Mask_OOF", "Invalid_Mask"]
        channel_dim: "no_channel"

    - EnsureTyped:
        keys: ["Image", "Mask", "Mask_OOF", "Invalid_Mask"]
        dtype: float32

    # === Intensity normalization (nnUNet style) ===
    - ScaleIntensityRanged:
        keys: ["Image"]
        a_min: 0.0
        a_max: 213.0
        b_min: -5.0
        b_max: 5.0
        clip: true

    # === 3D patch extraction ===
    - RandCropByPosNegLabeld:
        keys: ["Image", "Mask", "Mask_OOF", "Invalid_Mask"]
        label_key: "Mask"
        spatial_size: ${input_size}
        pos: 2
        neg: 0
        num_samples: 2
        image_key: "Image"
        image_threshold: 0.0

    # === Spatial augmentations (if enabled, Invalid_Mask is already covered) ===
    # - RandFlipd:
    #     keys: ["Image", "Mask", "Mask_OOF", "Invalid_Mask"]
    #     prob: 0.5
    #     spatial_axis: 0
    # ...

    - ToTensord:
        keys: ["Image", "Mask", "Mask_OOF", "Invalid_Mask"]

  val:
    - EnsureChannelFirstd:
        keys: ["Image", "Mask", "Mask_OOF", "Invalid_Mask"]
        channel_dim: "no_channel"

    - EnsureTyped:
        keys: ["Image", "Mask", "Mask_OOF", "Invalid_Mask"]
        dtype: float32

    - ScaleIntensityRanged:
        keys: ["Image"]
        a_min: 0.0
        a_max: 213.0
        b_min: -5.0
        b_max: 5.0
        clip: true

    - ToTensord:
        keys: ["Image", "Mask", "Mask_OOF", "Invalid_Mask"]

  test:
    - EnsureChannelFirstd:
        keys: ["Image", "Mask_OOF"]
        channel_dim: "no_channel"

    - EnsureTyped:
        keys: ["Image", "Mask_OOF"]
        dtype: float32

    - ScaleIntensityRanged:
        keys: ["Image"]
        a_min: 0.0
        a_max: 213.0
        b_min: -5.0
        b_max: 5.0
        clip: true

    - ToTensord:
        keys: ["Image", "Mask_OOF"]
