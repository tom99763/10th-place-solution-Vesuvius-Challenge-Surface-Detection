transforms:
  train:
    - EnsureChannelFirstd:
        keys: ["Image", "Z", "Mask"]
        channel_dim: "no_channel"

    - EnsureTyped:
        keys: ["Image", "Z", "Mask"]
        dtype: float32

    # === Intensity handling: exactly what nnUNet CTNormalization does ===
    - ScaleIntensityRanged:
        keys: ["Image"]
        a_min: 0.0          # percentile_00_5
        a_max: 213.0        # percentile_99_5 → from your JSON!
        b_min: -5.0
        b_max: 5.0
        clip: true

    # === 3D patch extraction: exactly 3d_fullres ===
    - RandCropByPosNegLabeld:
        keys: ["Image", "Z", "Mask"]
        label_key: "Z"
        spatial_size: ${input_size}   # ← exact patch_size from 3d_fullres
        pos: 2
        neg: 0
        num_samples: 2
        image_key: "Image"
        image_threshold: 0.0

#    # Optional light 3D augmentations (commented out)
#    - Rand3DElasticd:
#        keys: ["Image", "Z", "Mask"]
#        prob: 0.3
#        sigma_range: [15, 25]
#        magnitude_range: [100, 200]
#        spatial_size: ${input_size}
#        mode: ["bilinear", "nearest", "nearest"]
#        padding_mode: "zeros"
#
#    - RandAffined:
#        keys: ["Image", "Z", "Mask"]
#        prob: 0.3
#        rotate_range: [(-0.26, 0.26), (-0.26, 0.26), (-0.05, 0.05)]
#        scale_range: [(-0.15, 0.15), (-0.15, 0.15), (-0.05, 0.05)]
#        mode: ["bilinear", "nearest", "nearest"]
#        spatial_size:${input_size}
#
#    - RandGaussianNoised:
#        keys: ["Image"]
#        prob: 0.15
#        mean: 0.0
#        std: 0.02

    - ToTensord:
        keys: ["Image", "Z", "Mask"]

  val:
    - EnsureChannelFirstd:
        keys: ["Image", "Z", "Mask"]
        channel_dim: "no_channel"

    - EnsureTyped:
        keys: ["Image", "Z", "Mask"]
        dtype: float32

    - ScaleIntensityRanged:
        keys: ["Image"]
        a_min: 0.0
        a_max: 213.0
        b_min: -5.0
        b_max: 5.0
        clip: true

    - ToTensord:
        keys: ["Image", "Z", "Mask"]

  test:
    - EnsureChannelFirstd:
        keys: ["Image"]
        channel_dim: "no_channel"

    - EnsureTyped:
        keys: ["Image"]
        dtype: float32

    - ScaleIntensityRanged:
        keys: ["Image"]
        a_min: 0.0
        a_max: 213.0
        b_min: -5.0
        b_max: 5.0
        clip: true

    - ToTensord:
        keys: ["Image"]